version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: topup
      POSTGRES_PASSWORD: topup
      POSTGRES_DB: topup
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    env_file: ./backend/.env
    ports: ["4000:4000"]
    depends_on: [postgres, redis]

  worker:
    build: ./backend
    command: node dist/queue/delivery.processor.js
    env_file: ./backend/.env
    depends_on: [postgres, redis]

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
    depends_on: [api]

volumes:
  pgdata:
